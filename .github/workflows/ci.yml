# PR CI: marketplace/プラグインの validate と整合性検査。
# チェックの実体は scripts/ にあり、ローカルでも同じものを実行できる。
name: CI

on:
  pull_request:
    # edited も対象: pr-policy は PR タイトルを lint するため、タイトルの変更でも再検査が必要
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

# push 直後にタイトルを編集すると synchronize と edited で run が二重に立つ。
# PR 単位 (main への push はブランチ単位) で 1 本に絞る
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Claude Code CLI をインストール
        run: npm install -g @anthropic-ai/claude-code
      - name: marketplace と各プラグインを validate
        # ルートの validate では各プラグインの SKILL.md frontmatter 破損を検出できないため、
        # 必ずプラグインディレクトリごとにも validate する
        run: |
          claude plugin validate .
          for d in plugins/*/; do claude plugin validate "$d"; done
      - name: marketplace ↔ plugin.json ↔ README の整合
        run: ./scripts/check-consistency.sh
      - name: 公式非推奨パターンの検査
        run: ./scripts/check-deprecated-patterns.sh
      - name: 判定基準の正本のスキーマ検査 (repo-standards.json)
        run: ./scripts/check-repo-standards.sh
      - name: スクリプトの判定テスト (scripts/test-*.sh を全部)
        # 列挙しない。列挙は足すたびに漏れる (#44) — 置けば走る形にして登録漏れを構造的に無くす。
        # 1 本落ちても残りを回し、落ちたものを全部見せてから赤にする
        run: |
          fail=0
          for t in scripts/test-*.sh; do
            echo "::group::$t"
            "./$t" || { fail=1; echo "::error::$t が失敗"; }
            echo "::endgroup::"
          done
          exit "$fail"

  pr-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: PR タイトルの Conventional Commits lint
        run: ./scripts/check-pr-title.sh
      - name: version bump の検査 (plugins/ に差分があれば bump 済みであること)
        run: BASE_REF=origin/${{ github.base_ref }} ./scripts/check-version-bump.sh
