# PR CI: marketplace/プラグインの validate と整合性検査。
# チェックの実体は scripts/ にあり、ローカルでも同じものを実行できる。
name: CI

on:
  pull_request:
    # edited/labeled/unlabeled も対象: pr-policy はタイトルとラベルから期待 bump を
    # 導出するため、それらの変更でも再検査が必要
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

# push 直後にタイトル編集やラベル付けをすると synchronize と edited で run が二重に立ち、
# guardrail のコメント重複チェック (check-then-act) が両方すり抜ける (Issue #63)。
# PR 単位 (main への push はブランチ単位) で 1 本に絞る
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Claude Code CLI をインストール
        run: npm install -g @anthropic-ai/claude-code
      - name: marketplace と各プラグインを validate
        # ルートの validate では各プラグインの SKILL.md frontmatter 破損を検出できないため、
        # 必ずプラグインディレクトリごとにも validate する
        run: |
          claude plugin validate .
          for d in plugins/*/; do claude plugin validate "$d"; done
      - name: marketplace ↔ plugin.json ↔ README の整合
        run: ./scripts/check-consistency.sh
      - name: 公式非推奨パターンの検査
        run: ./scripts/check-deprecated-patterns.sh
      - name: 上流参照のマニフェスト網羅 (upstream-refs.json)
        run: ./scripts/check-upstream-refs.sh --coverage
      - name: 同梱スクリプトの判定テスト
        run: |
          ./scripts/test-rs-audit-repo.sh
          ./scripts/test-rs-audit-github.sh
          ./scripts/test-rs-audit-min.sh
          ./scripts/test-rs-evidence.sh
          ./scripts/test-rs-findings.sh
          ./scripts/test-rs-doctor-env.sh
          ./scripts/test-rs-ci-watch.sh
          ./scripts/test-rs-branch-sweep.sh
          ./scripts/test-rs-worktree-sweep.sh
          ./scripts/test-rs-plan-gate.sh
          ./scripts/test-rs-inflight.sh
          ./scripts/test-repo-settings.sh
      - name: リポ側チェックスクリプトの判定テスト
        run: |
          ./scripts/test-upstream-refs.sh
          ./scripts/test-guardrail-weakening.sh
          ./scripts/test-upsert-pr-comment.sh

  pr-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: PR タイトルの Conventional Commits lint
        run: ./scripts/check-pr-title.sh
      - name: version bump の検査 (タイトル type / release:* ラベルから期待増分を導出)
        run: BASE_REF=origin/${{ github.base_ref }} ./scripts/check-version-bump.sh

  # 守り (テスト・CI・チェックスクリプト) を弱める変更の可視化。
  # 意図的に緩めることはあるのでブロックせず、ラベルとコメントで必ず目に入るようにする
  # (経緯は Issue #18)。他のジョブと分けてあるのは、失敗させない性質が違うため
  guardrail:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      MARKER: '<!-- guardrail-weakening -->'
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        name: 守りを弱める変更の検知
        run: BASE_REF=origin/${{ github.base_ref }} ./scripts/check-guardrail-weakening.sh | tee /tmp/guardrail.txt
      - name: 検出内容を PR に可視化する
        if: steps.check.outputs.found == 'true'
        run: |
          gh pr edit "$PR" --add-label guardrail-change
          # 初回だけ投稿するのでなく毎回 upsert する: コメントが常に現在の HEAD の
          # 検出内容を表し、並行実行で二重投稿されても 1 件に収束する (Issue #63)
          {
            echo "$MARKER"
            echo '### 守りを弱める変更を検出しました'
            echo
            echo 'テスト・CI・チェックスクリプトを削る変更が含まれています。**マージはブロックしません**が、意図的なら PR 本文に理由を書いてください。'
            echo
            echo '```'
            grep '^WEAKENING:' /tmp/guardrail.txt
            echo '```'
            echo
            echo "<sub>このコメントは push のたびに更新されます (対象コミット: \`${HEAD_SHA:0:7}\`)。</sub>"
          } > /tmp/guardrail-comment.md
          ./scripts/upsert-pr-comment.sh /tmp/guardrail-comment.md
      - name: 検出が解消されたら可視化を取り下げる
        if: steps.check.outputs.found == 'false'
        run: |
          # 付いていないラベルを外そうとするとエラーになるので、有無を見てから外す
          if gh pr view "$PR" --json labels --jq '.labels[].name' | grep -qx guardrail-change; then
            gh pr edit "$PR" --remove-label guardrail-change
            echo "指摘が解消されたのでラベルを外した"
          fi
          # ラベルだけ外してコメントを残すと「弱めている」と読める表示が残り続けるため、
          # コメント側も解消済みへ更新する (無ければ何もしない)
          {
            echo "$MARKER"
            echo '### 守りを弱める変更は解消されました'
            echo
            echo "以前のコミットでは検出していましたが、現在の HEAD (\`${HEAD_SHA:0:7}\`) では検出されていません。"
          } > /tmp/guardrail-comment.md
          ./scripts/upsert-pr-comment.sh /tmp/guardrail-comment.md --update-only
